<!-- Appmenu\templates\base.html-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LourdesSushi</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <!-- Aquí puedes añadir el token CSRF como una meta etiqueta para usarlo en el JavaScript -->
    <meta name="csrf-token" content="{{ csrf_token }}">
  </head>
  <body>
    <!-- Navbar -->
    {% block navbar %}
    {% include 'navbar.html' %}
    {% endblock %}
    

    {% block content %}
    <div class="container">
      <!-- Aquí se incluirá el contenido específico de cada página -->
    </div>    
    {% endblock %}


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'js/modal.js' %}"></script>
    <script src="{% static 'js/card_agregar.js' %}"></script>
    <script src="{% static 'js/carrito_siderbar.js' %}"></script>
    <script src="{% static 'js/boton_carrito.js' %}"></script>


    <!-- Capturar el token CSRF en el JavaScript -->
    <script>
      const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

      function getCookie(name) {
        if (name === 'csrftoken') {
          return csrfToken;
        }
        return null;
      }
    </script>

  </body>
</html>
